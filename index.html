<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- `maximum-scale=1.0` retire : il bloquait le pincer-zoomer, ce qui est un
         blocage d'accessibilite — et Safari iOS l'ignore de toute facon pour son
         zoom automatique au focus. Ce dernier se regle par des champs a 16 px,
         fait dans le meme commit ; l'ordre compte, retirer la contrainte avant
         les champs aurait laisse l'utilisateur zoome sans retour.
         `viewport-fit=cover` : c'est lui qui rend `env(safe-area-inset-*)` non nul. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2E4A3F" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>Epicure — Gestion du dépôt</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
